<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>두뇌 산책</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: night-indigo hero with drawn mountain ridges and moon; floating "오늘의 산책" card; 2-column game cards, each with its own colour and small illustration. Game screens keep a compact hero band. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --ink:#18203A; --muted:#565F78; --line:#DCE0EB;
  --accent:#2E4A8C; --accent-ink:#FFFFFF; --gold:#E9AE2E; --gold-soft:#FBF0D3;
  --good:#1F7A4A; --good-soft:#DCF0E3; --bad:#B4432C; --bad-soft:#F8E0D9;
  --c-blocks:#E0604A; --c-numbers:#3556A6; --c-pairs:#24896A; --c-math:#C98A12; --c-proverb:#83519F;
  --b1:#2F8F83; --b2:#E0A42A; --b3:#D0644B; --b4:#4C7CC0; --b5:#8A63B5; --b6:#5C9E4A;
  --shadow:0 10px 30px rgba(22,32,64,.12);
  --hero-ink:#FFF8E8; --hero-soft:rgba(255,248,232,.82); --hero-line:rgba(255,248,232,.32); --hero-fill:rgba(255,248,232,.09); --moon:#F4C95D;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --base:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --surface:#171F36; --ink:#EDF0F8; --muted:#A3ACC8; --line:#2A3453;
    --accent:#93AAEB; --accent-ink:#0E1322; --gold:#F2C15A; --gold-soft:#3A3220;
    --good:#74D39C; --good-soft:#1E3A2B; --bad:#EE8C73; --bad-soft:#40241D;
    --c-blocks:#F08A74; --c-numbers:#8DA6EA; --c-pairs:#5CC9A4; --c-math:#F0C05A; --c-proverb:#C69BE0;
    --b1:#4FC0AC; --b2:#F2BE5C; --b3:#EE8C73; --b4:#77A4E6; --b5:#B190DD; --b6:#86C870;
    --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171F36; --ink:#EDF0F8; --muted:#A3ACC8; --line:#2A3453;
  --accent:#93AAEB; --accent-ink:#0E1322; --gold:#F2C15A; --gold-soft:#3A3220;
  --good:#74D39C; --good-soft:#1E3A2B; --bad:#EE8C73; --bad-soft:#40241D;
  --c-blocks:#F08A74; --c-numbers:#8DA6EA; --c-pairs:#5CC9A4; --c-math:#F0C05A; --c-proverb:#C69BE0;
  --b1:#4FC0AC; --b2:#F2BE5C; --b3:#EE8C73; --b4:#77A4E6; --b5:#B190DD; --b6:#86C870;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
:root[data-size="large"]{ --base:24px; }
html{ font-size:var(--base); }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:1rem; line-height:1.6; margin:0; word-break:keep-all; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible{ outline:4px solid var(--gold); outline-offset:3px; }
.gutter{ padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }

/* Hero */
.hero{ position:relative; overflow:hidden; background:linear-gradient(180deg, #111A35 0%, #1E2F62 70%, #2B4180 100%); color:var(--hero-ink); }
.hero canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.hero-in{ position:relative; max-width:960px; margin:0 auto; padding-block:26px 84px; display:grid; gap:12px; }
.hero-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.eyebrow{ margin:0; font-size:.82rem; letter-spacing:.08em; color:var(--moon); font-weight:700; }
.size-btn{ background:var(--hero-fill); color:var(--hero-ink); border:1.5px solid var(--hero-line); border-radius:999px; padding:.45rem 1rem; min-height:48px; font-weight:700; font-size:.9rem; }
.size-btn[aria-pressed="true"]{ background:var(--moon); color:#1A1F33; border-color:var(--moon); }
h1{ font-family:var(--f-display); font-weight:700; font-size:clamp(2.7rem, 11vw, 4.4rem); line-height:1.05; letter-spacing:-.02em; margin:6px 0 0; text-wrap:balance; }
h1 em{ font-style:normal; color:var(--moon); }
.lead{ margin:0; font-size:1.1rem; color:var(--hero-soft); max-width:26em; }
.badges{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.badge{ border:1px solid var(--hero-line); background:var(--hero-fill); padding:.25rem .85rem; border-radius:999px; font-size:.85rem; font-weight:500; }
body.in-game .hero-in{ padding-block:14px 22px; gap:4px; }
body.in-game h1{ font-size:1.9rem; margin:0; }
body.in-game .lead, body.in-game .badges{ display:none; }

/* Main */
.wrap{ max-width:960px; margin:0 auto; padding-block:0 40px; }
.today-card{ position:relative; margin-top:-52px; background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:16px 20px; display:grid; gap:10px; margin-bottom:22px; }
.today-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
.today-row strong{ font-family:var(--f-display); font-size:1.3rem; }
.today-row span{ color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; }
.progress{ height:12px; border-radius:999px; background:var(--line); overflow:hidden; }
.progress i{ display:block; height:100%; background:linear-gradient(90deg, var(--gold), var(--c-blocks)); border-radius:999px; transition:width .6s; }
.today-msg{ margin:0; color:var(--muted); font-size:.92rem; }

.grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap:18px; }
.game-card{ --c:var(--accent); text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:22px; padding:0; overflow:hidden; display:grid; grid-template-rows:auto 1fr; transition:transform .2s, box-shadow .2s, border-color .2s; }
.game-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--c); }
.art{ height:132px; background:color-mix(in srgb, var(--c) 15%, var(--surface)); display:grid; place-items:center; position:relative; overflow:hidden; }
.art::before{ content:""; position:absolute; width:220px; height:220px; border-radius:50%; right:-60px; top:-90px; background:color-mix(in srgb, var(--c) 14%, transparent); }
.card-body{ padding:16px 20px 20px; display:grid; gap:6px; align-content:start; }
.tag{ color:var(--c); font-weight:700; font-size:.8rem; letter-spacing:.06em; }
.card-body h2{ font-family:var(--f-display); font-weight:700; font-size:1.5rem; line-height:1.25; margin:0; }
.card-body p{ margin:0; color:var(--muted); font-size:.95rem; }
.card-foot{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px; }
.start{ background:var(--c); color:var(--surface); padding:.45rem 1.15rem; border-radius:999px; font-weight:800; }
.chip{ background:var(--good-soft); color:var(--good); padding:.28rem .8rem; border-radius:999px; font-weight:700; font-size:.82rem; }

/* card illustrations */
.a-blocks{ position:relative; display:grid; grid-template-columns:repeat(5, 26px); grid-template-rows:repeat(3, 26px); gap:4px; }
.a-blocks i{ border-radius:7px; background:var(--k); box-shadow:inset 0 -3px 0 rgba(0,0,0,.12); }
.a-tiles{ position:relative; display:flex; gap:10px; }
.a-tiles span{ width:58px; height:58px; border-radius:14px; background:var(--surface); border:2px solid color-mix(in srgb, var(--c) 40%, var(--line)); display:grid; place-items:center; font-weight:900; font-size:1.4rem; color:var(--c); }
.a-tiles span.on{ background:var(--c); color:var(--surface); border-color:var(--c); }
.a-tiles span.back{ background:var(--c); border-color:var(--c); color:var(--surface); background-image:radial-gradient(color-mix(in srgb, var(--surface) 25%, transparent) 18%, transparent 20%); background-size:14px 14px; }
.a-math{ position:relative; font-family:var(--f-display); font-weight:700; font-size:2.4rem; color:var(--ink); letter-spacing:.02em; }
.a-math b{ color:var(--c); }
.a-bubble{ position:relative; background:var(--surface); border:2px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-radius:18px; padding:.55rem 1.1rem; font-family:var(--f-display); font-weight:700; font-size:1.25rem; }
.a-bubble::after{ content:""; position:absolute; left:26px; bottom:-10px; width:16px; height:16px; background:var(--surface); border-right:2px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-bottom:2px solid color-mix(in srgb, var(--c) 45%, var(--line)); transform:rotate(45deg); }
.a-bubble b{ color:var(--c); }

/* game screen */
.bar{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-top:18px; }
.back-btn{ background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:.5rem 1rem; min-height:54px; font-weight:700; }
.stats{ display:flex; flex-wrap:wrap; gap:8px; }
.stat{ background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:.3rem .85rem; font-variant-numeric:tabular-nums; }
.gtitle{ font-family:var(--f-display); font-weight:700; font-size:2rem; margin:18px 0 2px; text-wrap:balance; }
.hint{ margin:0 0 14px; color:var(--muted); }
.levels{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.lv{ background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:.42rem 1rem; min-height:50px; font-weight:700; }
.lv[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.rule{ text-align:center; font-weight:700; margin:0 0 10px; }

.next-box{ display:flex; align-items:center; justify-content:center; gap:14px; background:var(--gold-soft); border-radius:16px; padding:10px 16px; margin:0 auto 16px; max-width:520px; font-size:1.05rem; font-weight:700; min-height:64px; }
.next-box strong{ font-weight:900; font-size:2.1rem; line-height:1; font-variant-numeric:tabular-nums; }
.board{ display:grid; grid-template-columns:repeat(var(--cols), 1fr); gap:10px; max-width:520px; margin:0 auto; }
.cell{ aspect-ratio:1; border:1.5px solid var(--line); border-radius:16px; background:var(--surface); font-weight:900; font-size:calc(min(520px, 100vw - 32px) / var(--cols) * .36); display:grid; place-items:center; box-shadow:0 3px 0 var(--line); transition:background .15s; }
.cell:active{ transform:translateY(2px); box-shadow:none; }
.cell.done{ background:var(--good-soft); border-color:var(--good); color:var(--good); box-shadow:none; }
.cell.wrong{ animation:shake .4s; background:var(--bad-soft); border-color:var(--bad); }
@keyframes shake{ 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

.pcard{ aspect-ratio:1; border-radius:16px; border:2px solid var(--c-pairs); padding:0; position:relative; overflow:hidden; background:var(--c-pairs);
  background-image:radial-gradient(color-mix(in srgb, var(--surface) 25%, transparent) 18%, transparent 20%); background-size:18px 18px; }
.pcard::after{ content:"?"; position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-display); font-weight:700; color:var(--surface); font-size:calc(min(560px, 100vw - 32px) / var(--cols) * .36); }
.pcard .face{ display:none; }
.pcard.open{ background:var(--surface); background-image:none; border-color:var(--line); animation:flip .25s; }
.pcard.open::after{ content:none; }
.pcard.open .face{ display:grid; place-items:center; align-content:center; gap:2px; height:100%; }
.pcard.matched{ background:var(--good-soft); border-color:var(--good); }
.pic{ font-size:calc(min(560px, 100vw - 32px) / var(--cols) * .38); line-height:1.1; }
.word{ font-size:min(.8rem, 3.2vw); font-weight:700; color:var(--muted); white-space:nowrap; }
.board.pairs{ max-width:560px; }
@keyframes flip{ from{transform:scaleX(.2)} to{transform:scaleX(1)} }

.q-box{ background:var(--surface); border:1.5px solid var(--line); border-radius:22px; padding:24px; max-width:660px; margin:0 auto; display:grid; gap:18px; box-shadow:var(--shadow); }
.q-label{ justify-self:center; background:var(--gold-soft); padding:.2rem .9rem; border-radius:999px; font-weight:700; font-size:.88rem; }
.q-text{ font-family:var(--f-display); font-weight:700; font-size:2rem; line-height:1.45; text-align:center; text-wrap:balance; }
.q-text.sm{ font-size:1.45rem; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.choices.wide{ grid-template-columns:1fr; }
.choice{ min-height:66px; border:1.5px solid var(--line); border-radius:14px; background:var(--bg); font-size:1.2rem; font-weight:700; padding:.5rem .9rem; font-variant-numeric:tabular-nums; }
.choice:hover:not([disabled]){ border-color:var(--accent); }
.choice.right{ background:var(--good-soft); border-color:var(--good); color:var(--good); }
.choice.wrong{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }
.choice[disabled]{ cursor:default; }
.feedback{ text-align:center; font-size:1.15rem; font-weight:700; min-height:1.6em; }
.feedback .ok{ color:var(--good); } .feedback .no{ color:var(--bad); }
.feedback small{ display:block; font-weight:500; color:var(--muted); font-size:1rem; font-family:var(--f-display); }

.btn{ background:var(--accent); color:var(--accent-ink); border:0; border-radius:14px; padding:.75rem 1.4rem; min-height:58px; font-size:1.08rem; font-weight:700; }
.btn.ghost{ background:var(--surface); color:var(--ink); border:1.5px solid var(--line); }
.center{ display:flex; justify-content:center; }
.finish{ background:var(--surface); border:1.5px solid var(--line); border-radius:22px; padding:30px 20px; max-width:560px; margin:0 auto; text-align:center; display:grid; gap:8px; box-shadow:var(--shadow); }
.finish .moon{ width:56px; height:56px; border-radius:50%; margin:0 auto 4px; background:radial-gradient(circle at 35% 35%, #FFE7A3, var(--moon)); box-shadow:0 0 0 10px var(--gold-soft); }
.finish h3{ font-family:var(--f-display); font-weight:700; font-size:2.1rem; margin:0; }
.finish p{ margin:0; font-size:1.12rem; }
.row{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:14px; }

.tb{ display:flex; gap:12px; justify-content:center; align-items:flex-start; }
.tb-main{ position:relative; flex:none; }
#cv{ display:block; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); }
.tb-side{ display:grid; gap:10px; width:96px; flex:none; }
.tb-next{ background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:8px 4px; display:grid; gap:4px; justify-items:center; font-size:.8rem; font-weight:700; color:var(--muted); }
.tb-side .btn{ min-height:52px; padding:.4rem; font-size:.9rem; }
.tb-over{ position:absolute; inset:0; display:grid; place-items:center; align-content:center; gap:14px; background:color-mix(in srgb, var(--bg) 85%, transparent); border-radius:14px; text-align:center; font-family:var(--f-display); font-weight:700; font-size:1.5rem; }
.pad{ display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; max-width:520px; margin:16px auto 0; }
.pk{ min-height:66px; border-radius:16px; border:1.5px solid var(--line); background:var(--surface); font-size:1.4rem; font-weight:700; touch-action:manipulation; user-select:none; -webkit-user-select:none; box-shadow:0 3px 0 var(--line); }
.pk:active{ background:var(--gold-soft); transform:translateY(2px); box-shadow:none; }
.pk.rot{ font-size:1.05rem; }
.pk.wide{ grid-column:1 / -1; background:var(--c-blocks); color:var(--surface); border-color:var(--c-blocks); font-size:1.15rem; box-shadow:none; }
.keys-hint{ text-align:center; color:var(--muted); font-size:.85rem; margin:10px 0 0; }

footer{ margin-top:44px; padding-top:16px; border-top:1.5px solid var(--line); color:var(--muted); font-size:.85rem; display:grid; gap:4px; }
footer p{ margin:0; }

@media (max-width:440px){ .q-text{ font-size:1.65rem; } .q-box{ padding:18px; } .art{ height:116px; } }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<header class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="hero-in gutter">
    <div class="hero-top">
      <p class="eyebrow">시니어 세상만사 · 두뇌 건강 놀이</p>
      <button class="size-btn" id="size-toggle" aria-pressed="false">글자 크게</button>
    </div>
    <h1>두뇌 <em>산책</em></h1>
    <p class="lead">하루 5분, 천천히 걷듯 머리를 깨우는 놀이 다섯 가지</p>
    <div class="badges"><span class="badge">시간 제한 없음</span><span class="badge">틀려도 괜찮아요</span><span class="badge">큰 글씨</span></div>
  </div>
</header>
<div class="wrap gutter">
  <main id="app"></main>
  <footer>
    <p>가볍게 즐기는 두뇌 활동 놀이입니다. 의학적 진단이나 치료를 대신하지 않아요.</p>
  </footer>
</div>

<script>
(function(){
  var app = document.getElementById('app');

  var store = {
    get: function(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
    set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  var now = new Date();
  var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  function doneToday(){ return store.get('done-' + today, []); }
  function markDone(id){ var s = doneToday(); if (s.indexOf(id) < 0){ s.push(id); store.set('done-' + today, s); } }

  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function rand(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function fmtTime(s){ var m = Math.floor(s / 60), r = s % 60; return m ? m + '분 ' + r + '초' : r + '초'; }
  function won(n){ return n.toLocaleString('ko-KR') + '원'; }

  var cleanup = null;
  function setCleanup(fn){ if (cleanup) cleanup(); cleanup = fn || null; }

  /* 밤하늘 산자락 */
  var sky = document.getElementById('sky');
  var seed = Math.random() * 1000;
  function drawSky(){
    var r = sky.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (!r.width) return;
    sky.width = r.width * dpr; sky.height = r.height * dpr;
    var g = sky.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var W = r.width, H = r.height;
    g.clearRect(0, 0, W, H);
    var s = seed;
    function rnd(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }
    for (var i = 0; i < 46; i++){
      var x = rnd() * W, y = rnd() * H * 0.55, a = 0.25 + rnd() * 0.6;
      g.fillStyle = 'rgba(255,248,232,' + a + ')'; g.beginPath(); g.arc(x, y, rnd() < 0.15 ? 1.6 : 0.9, 0, Math.PI * 2); g.fill();
    }
    var mx = W * (W < 600 ? 0.82 : 0.8), my = H * 0.3, mr = Math.min(46, Math.max(26, W * 0.05));
    var glow = g.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 3.2);
    glow.addColorStop(0, 'rgba(244,201,93,.35)'); glow.addColorStop(1, 'rgba(244,201,93,0)');
    g.fillStyle = glow; g.beginPath(); g.arc(mx, my, mr * 3.2, 0, Math.PI * 2); g.fill();
    var moon = g.createRadialGradient(mx - mr * .35, my - mr * .35, mr * .1, mx, my, mr);
    moon.addColorStop(0, '#FFEFC2'); moon.addColorStop(1, '#F4C95D');
    g.fillStyle = moon; g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
    var layers = [
      { base:.58, amp:.10, col:'rgba(84,110,180,.45)', f:1.3 },
      { base:.68, amp:.09, col:'rgba(58,80,150,.65)', f:2.1 },
      { base:.78, amp:.07, col:'rgba(36,54,112,.85)', f:3.0 },
      { base:.88, amp:.05, col:'rgba(20,32,74,1)', f:4.2 }
    ];
    layers.forEach(function(L, li){
      var p1 = rnd() * 6, p2 = rnd() * 6;
      g.fillStyle = L.col; g.beginPath(); g.moveTo(0, H);

    function makeSeq(mode){
      var s = [], i;
      if (mode === 'basic'){ for (i = 1; i <= 16; i++) s.push(String(i)); }
      else if (mode === 'reverse'){ for (i = 25; i >= 1; i--) s.push(String(i)); }

      else {
        var pool = []; for (i = 1; i <= 99; i++) pool.push(i);

      var M = MODES[lv], seq = makeSeq(lv), idx = 0, sec = 0, miss = 0;

  /* 같은 그림 짝 맞추기 */
  var PICS = [['🍎','사과'],['🍊','귤'],['🍇','포도'],['🍓','딸기'],['🌻','해바라기'],['🌷','튤립'],['🐟','물고기'],['🐓','닭'],['☕','커피'],['🌙','달'],['🏠','집'],['🚲','자전거']];
  function pairsGame(){
    var ui = shell('pairs', '카드를 두 장씩 눌러 열어 보세요. 같은 그림이면 그대로 열려 있어요.');
    var LV = [{id:'6',label:'쉬움 6쌍'},{id:'8',label:'보통 8쌍'},{id:'10',label:'어려움 10쌍'}];
    var lv = store.get('lv-pairs', '6'); if (!LV.some(function(l){ return l.id === lv; })) lv = '6';
    function start(){
      levelPicker(ui.controls, 'lv-pairs', LV, lv, function(v){ lv = v; start(); });
      var k = +lv, cols = k === 10 ? 5 : 4;
      var picks = shuffle(PICS).slice(0, k), deck = shuffle(picks.concat(picks));
      var first = null, lock = false, tries = 0, matched = 0, sec = 0;
      ui.stage.innerHTML = '<div class="board pairs" style="--cols:' + cols + '" id="board">' + deck.map(function(p, i){
        return '<button class="pcard" data-i="' + i + '" aria-label="뒤집힌 카드"><span class="face"><span class="pic">' + p[0] + '</span><span class="word">' + p[1] + '</span></span></button>';
      }).join('') + '</div>';
      function stats(){ ui.stats.innerHTML = '<span class="stat">찾은 짝 <strong>' + matched + ' / ' + k + '</strong></span><span class="stat">시도 <strong>' + tries + '번</strong></span><span class="stat">시간 <strong>' + fmtTime(sec) + '</strong></span>'; }
      stats();
      var timer = setInterval(function(){ sec++; stats(); }, 1000);
      setCleanup(function(){ clearInterval(timer); });
      ui.stage.querySelector('#board').onclick = function(e){
        var c = e.target.closest('.pcard');
        if (!c || lock || c.classList.contains('open')) return;
        c.classList.add('open'); c.setAttribute('aria-label', deck[+c.getAttribute('data-i')][1]);
        if (!first){ first = c; return; }
        tries++;
        var a = deck[+first.getAttribute('data-i')][1], b = deck[+c.getAttribute('data-i')][1];
        if (a === b){
          first.classList.add('matched'); c.classList.add('matched'); first = null; matched++; stats();
          if (matched === k){
            clearInterval(timer); markDone('pairs');
            setTimeout(function(){ finish(ui.stage, '짝을 모두 찾으셨어요!', [tries + '번 만에 ' + k + '쌍을 찾았어요.', '걸린 시간 ' + fmtTime(sec)], start); }, 600);
          }
        } else {
          lock = true; var f = first; first = null; stats();
          setTimeout(function(){
            [f, c].forEach(function(x){ x.classList.remove('open'); x.setAttribute('aria-label', '뒤집힌 카드'); });
            lock = false;
          }, 1200);
        }
      };
    }
    start();
  }

  /* 문제 풀이 공통 */
  function quizGame(id, hint, makeQs, wide, levels){
    var ui = shell(id, hint);
    var lv = levels ? store.get('lv-' + id, levels.def) : null;
    if (levels && !levels.list.some(function(l){ return l.id === lv; })) lv = levels.def;
    function start(){
      setCleanup();
      if (levels) levelPicker(ui.controls, 'lv-' + id, levels.list, lv, function(v){ lv = v; start(); });
      else ui.controls.innerHTML = '';
      var qs = makeQs(lv), i = 0, score = 0;
      function stats(){ ui.stats.innerHTML = '<span class="stat">문제 <strong>' + Math.min(i + 1, qs.length) + ' / ' + qs.length + '</strong></span><span class="stat">맞힌 수 <strong>' + score + '</strong></span>'; }
      function show(){
        var q = qs[i], answered = false;
        stats();
        ui.stage.innerHTML = '<div class="q-box">' + (q.label ? '<span class="q-label">' + q.label + '</span>' : '') +
          '<div class="q-text' + (q.sm ? ' sm' : '') + '">' + q.prompt + '</div>' +
          '<div class="choices' + (wide || q.wide ? ' wide' : '') + '">' + q.choices.map(function(c, ci){ return '<button class="choice" data-ci="' + ci + '">' + c + '</button>'; }).join('') + '</div>' +
          '<div class="feedback" id="fb" aria-live="polite"></div><div class="center" id="nx"></div></div>';
        var btns = ui.stage.querySelectorAll('.choice');
        btns.forEach(function(btn){
          btn.onclick = function(){
            if (answered) return; answered = true;
            var pick = q.choices[+btn.getAttribute('data-ci')], ok = pick === q.answer;
            if (ok) score++;
            btns.forEach(function(x){ x.disabled = true; if (q.choices[+x.getAttribute('data-ci')] === q.answer) x.classList.add('right'); });
            if (!ok) btn.classList.add('wrong');
            ui.stage.querySelector('#fb').innerHTML = (ok ? '<span class="ok">맞았어요!</span>' : '<span class="no">정답은 ' + q.answer + ' 이에요.</span>') + (q.after ? '<small>' + q.after + '</small>' : '');
            stats();
            var last = i === qs.length - 1;
            ui.stage.querySelector('#nx').innerHTML = '<button class="btn" id="nextq">' + (last ? '결과 보기' : '다음 문제') + '</button>';
            var nb = ui.stage.querySelector('#nextq'); nb.focus({ preventScroll:true });
            nb.onclick = function(){
              if (last){
                markDone(id);
                var t = score >= 8 ? '아주 잘하셨어요!' : score >= 5 ? '잘하셨어요!' : '수고하셨어요!';
                ui.stats.innerHTML = '';
                finish(ui.stage, t, [qs.length + '문제 중 ' + score + '문제를 맞히셨어요.', '내일 또 한 판 해 보세요.'], start);
              } else { i++; show(); }
            };
          };
        });
      }
      show();
    }
    start();
  }

  function withChoices(ans, deltas, fmt){
    var set = [ans];
    shuffle(deltas).forEach(function(d){ var v = ans + d; if (set.length < 4 && v > 0 && set.indexOf(v) < 0) set.push(v); });
    return { choices: shuffle(set).map(fmt), answer: fmt(ans) };
  }

  function makeMath(){
    var types = shuffle(['add','add','add','sub','sub','sub','mul','mul','chg','chg']);
    return types.map(function(t){
      var q;
      if (t === 'add'){ var a = rand(12, 58), b = rand(5, 39); q = withChoices(a + b, [1,2,10,-1,-2,-10,3], String); q.label = '덧셈'; q.prompt = a + ' + ' + b + ' = ?'; }
      else if (t === 'sub'){ var a2 = rand(30, 95), b2 = rand(6, a2 - 8); q = withChoices(a2 - b2, [1,2,10,-1,-2,-10,3], String); q.label = '뺄셈'; q.prompt = a2 + ' − ' + b2 + ' = ?'; }
      else if (t === 'mul'){ var a3 = rand(2, 9), b3 = rand(2, 9); q = withChoices(a3 * b3, [a3, -a3, b3, -b3, 1, -1], String); q.label = '구구단'; q.prompt = a3 + ' × ' + b3 + ' = ?'; }
      else {
        var price = rand(11, 92) * 100, paid = price < 5000 ? 5000 : 10000;
        q = withChoices(paid - price, [100,200,500,1000,-100,-200,-500,-1000], won);
        q.label = '거스름돈'; q.prompt = '시장에서 ' + won(price) + '어치 사고<br>' + won(paid) + '을 냈어요.<br>거스름돈은?';
      }
      return q;
    });
  }

  function makeIdioms(lv){
    var pool = IDIOMS[lv] || IDIOMS.low;
    var kinds = lv === 'low' ? ['mean2idiom','tail'] : lv === 'mid' ? ['mean2idiom','idiom2mean'] : ['hanja','hanja','mean2idiom','idiom2mean'];
    return shuffle(pool).slice(0, 10).map(function(p, n){
      var others = shuffle(pool.filter(function(x){ return x !== p; })).slice(0, 3);
      var kind = kinds[n % kinds.length], q = { after: p[0] + ' (' + p[1] + ') · ' + p[2] };
      if (kind === 'mean2idiom'){ q.label = '뜻을 보고 고르기'; q.prompt = p[2]; q.sm = true; q.answer = p[0]; q.choices = shuffle([p[0]].concat(others.map(function(x){ return x[0]; }))); }
      else if (kind === 'idiom2mean'){ q.label = '알맞은 뜻 고르기'; q.prompt = p[0]; q.wide = true; q.answer = p[2]; q.choices = shuffle([p[2]].concat(others.map(function(x){ return x[2]; }))); }
      else if (kind === 'tail'){ q.label = '뒷글자 잇기'; q.prompt = p[0].slice(0, 2) + ' <span style="color:var(--c-proverb)">○○</span>'; q.answer = p[0].slice(2); q.choices = shuffle([q.answer].concat(others.map(function(x){ return x[0].slice(2); }))); }
      else { q.label = '한자 읽기'; q.prompt = p[1]; q.answer = p[0]; q.choices = shuffle([p[0]].concat(others.map(function(x){ return x[0]; }))); q.after = p[1] + ' · ' + p[2]; }
      return q;
    });
  }
  var IDIOM_LEVELS = { def:'low', list:[{id:'low',label:'하 · 기본 사자성어'},{id:'mid',label:'중 · 뜻 풀이'},{id:'high',label:'상 · 한자 읽기'}] };


  function render(){
    var v = location.hash.replace('#', '');
    var inGame = !!GAMES[v];
    document.body.classList.toggle('in-game', inGame);
    if (v === 'blocks') blocksGame();
    else if (v === 'numbers') numbersGame();
    else if (v === 'pairs') pairsGame();
    else if (v === 'math') quizGame('math', '보기 중에서 정답을 골라 주세요. 시간 제한은 없어요.', makeMath, false);
    else if (v === 'idiom') quizGame('idiom', '단계를 고르고 알맞은 답을 골라 주세요. 한 판에 10문제가 나오고, 답을 고르면 한자와 뜻을 함께 알려 드려요.', makeIdioms, false, IDIOM_LEVELS);
    else home();
    drawSky();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
